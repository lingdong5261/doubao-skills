name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验 SKILL.md 结构
        run: python scripts/validate_skills.py .

      - name: 语法检查所有 Python 脚本
        run: python -m compileall -q .
